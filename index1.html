<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <style>
        /* ========== RESET & BASE ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        /* ========== CONTAINER ========== */
        .container {
            background: #fff;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            font-size: 28px;
        }

        h1 span {
            color: #667eea;
        }

        /* ========== INPUT AREA ========== */
        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-area input:focus {
            border-color: #667eea;
        }

        .input-area button {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.3s;
        }

        .input-area button:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        /* ========== FILTERS ========== */
        .filters {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .filters button {
            padding: 6px 16px;
            border: 2px solid #667eea;
            background: transparent;
            color: #667eea;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .filters button.active,
        .filters button:hover {
            background: #667eea;
            color: white;
        }

        /* ========== TASK LIST ========== */
        .task-list {
            list-style: none;
        }

        .task-list li {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: #f8f9ff;
            border-radius: 10px;
            margin-bottom: 10px;
            transition: all 0.3s;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .task-list li:hover {
            background: #eef0ff;
        }

        .task-list li.completed span {
            text-decoration: line-through;
            color: #aaa;
        }

        .task-list li span {
            flex: 1;
            font-size: 16px;
            color: #333;
        }

        /* ========== CHECKBOX ========== */
        .task-list li input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }

        /* ========== DELETE BUTTON ========== */
        .delete-btn {
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s, transform 0.2s;
        }

        .delete-btn:hover {
            background: #e84040;
            transform: scale(1.1);
        }

        /* ========== STATS ========== */
        .stats {
            text-align: center;
            color: #999;
            font-size: 14px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        /* ========== EMPTY STATE ========== */
        .empty-state {
            text-align: center;
            padding: 30px;
            color: #ccc;
            font-size: 16px;
        }

        .empty-state .emoji {
            font-size: 48px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 To-Do <span>List</span></h1>

    <!-- Input Area -->
    <div class="input-area">
        <input type="text" id="taskInput" placeholder="Add a new task..." />
        <button onclick="addTask()">Add</button>
    </div>

    <!-- Filter Buttons -->
    <div class="filters">
        <button class="active" onclick="filterTasks('all', this)">All</button>
        <button onclick="filterTasks('pending', this)">Pending</button>
        <button onclick="filterTasks('completed', this)">Completed</button>
    </div>

    <!-- Task List -->
    <ul class="task-list" id="taskList">
        <div class="empty-state" id="emptyState">
            <div class="emoji">🎯</div>
            <p>No tasks yet. Add one above!</p>
        </div>
    </ul>

    <!-- Stats -->
    <div class="stats" id="stats"></div>
</div>

<script>
    // ========== DATA ==========
    let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
    let currentFilter = 'all';

    // ========== RENDER TASKS ==========
    function renderTasks() {
        const taskList = document.getElementById('taskList');
        const emptyState = document.getElementById('emptyState');

        // Filter tasks
        let filteredTasks = tasks;
        if (currentFilter === 'pending') {
            filteredTasks = tasks.filter(t => !t.completed);
        } else if (currentFilter === 'completed') {
            filteredTasks = tasks.filter(t => t.completed);
        }

        // Clear list
        taskList.innerHTML = '';

        if (filteredTasks.length === 0) {
            taskList.innerHTML = `
                <div class="empty-state">
                    <div class="emoji">🎯</div>
                    <p>No tasks here!</p>
                </div>`;
        } else {
            filteredTasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.className = task.completed ? 'completed' : '';
                li.innerHTML = `
                    <input type="checkbox" 
                           ${task.completed ? 'checked' : ''} 
                           onchange="toggleTask(${task.id})" />
                    <span>${escapeHTML(task.text)}</span>
                    <button class="delete-btn" onclick="deleteTask(${task.id})">🗑️</button>
                `;
                taskList.appendChild(li);
            });
        }

        updateStats();
        saveTasks();
    }

    // ========== ADD TASK ==========
    function addTask() {
        const input = document.getElementById('taskInput');
        const text = input.value.trim();

        if (text === '') {
            input.style.borderColor = '#ff4757';
            setTimeout(() => input.style.borderColor = '#e0e0e0', 1000);
            return;
        }

        const newTask = {
            id: Date.now(),
            text: text,
            completed: false
        };

        tasks.push(newTask);
        input.value = '';
        renderTasks();
    }

    // ========== TOGGLE TASK ==========
    function toggleTask(id) {
        tasks = tasks.map(task =>
            task.id === id ? { ...task, completed: !task.completed } : task
        );
        renderTasks();
    }

    // ========== DELETE TASK ==========
    function deleteTask(id) {
        tasks = tasks.filter(task => task.id !== id);
        renderTasks();
    }

    // ========== FILTER TASKS ==========
    function filterTasks(filter, btn) {
        currentFilter = filter;

        // Update active button
        document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        renderTasks();
    }

    // ========== UPDATE STATS ==========
    function updateStats() {
        const total = tasks.length;
        const completed = tasks.filter(t => t.completed).length;
        const pending = total - completed;

        document.getElementById('stats').innerHTML =
            `📊 Total: ${total} | ✅ Done: ${completed} | ⏳ Pending: ${pending}`;
    }

    // ========== SAVE TO LOCALSTORAGE ==========
    function saveTasks() {
        localStorage.setItem('tasks', JSON.stringify(tasks));
    }

    // ========== ESCAPE HTML (Security) ==========
    function escapeHTML(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // ========== ENTER KEY SUPPORT ==========
    document.getElementById('taskInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') addTask();
    });

    // ========== INITIAL RENDER ==========
    renderTasks();
</script>

</body>
</html>
